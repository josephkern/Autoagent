[project]
name = "autoagent"
version = "0.1.0"
description = "Autonomous agent engineering — self-improving AI agent harness"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai-agents>=0.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["agent.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
]

[tool.coverage.run]
source = ["agent"]

[tool.coverage.report]
fail_under = 70
